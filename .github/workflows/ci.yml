name: MBHMS Monorepo CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-ci:
    name: Backend CI (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/MBHMS.sln

      - name: Build solution
        run: dotnet build backend/MBHMS.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test backend/MBHMS.sln --no-build -c Release --verbosity normal

  frontend-ci:
    name: Frontend CI (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build Next.js application
        working-directory: frontend
        run: npm run build
